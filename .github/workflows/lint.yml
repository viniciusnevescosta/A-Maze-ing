name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.python == '3.10' && 'Lint and Tests' || 'Python 3.14' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.10", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: make install

      - name: Check Python syntax
        run: make syntax

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Rebuild reusable package from sources
        run: python -m build
