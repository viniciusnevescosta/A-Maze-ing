[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable perfect and non-perfect maze generation for A-Maze-ing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{name = "vneves-c"}, {name = "brde-car"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen*"]
namespaces = false

[tool.setuptools.package-data]
mazegen = ["py.typed"]

[tool.mypy]
exclude = ['^build/', '^dist/', '^\.venv/']

[tool.pytest.ini_options]
testpaths = ["tests"]
